[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "index-engine"
version = "0.1.0"
description = "Airfare Price Index / Statistical Modeling Engine for the SIH real-time airfare CPI-augmentation project"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.27"]
viz = ["matplotlib>=3.7"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
db = ["psycopg2-binary>=2.9"]
forecasting = ["openpyxl>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
